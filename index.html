<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Biglietto Treno Form JS</title>
</head>

<body>

    <h2>CALCOLA IL PREZZO DEL TUO BIGLIETTO</h2>
    <!-- dati in input -->
    <form action="#">

        <!-- richiesta km da percorrere -->
        <label>Inserisci km da percorrere:</label>
        <input id="campoNumeroKm" type="text" required>

        <!-- richiesta fascia d'erà -->
        <label>Fascia d'età:</label>
        <select name="età" id="fasciaEta" required>
            <option value="minorenne">Minorenne</option>
            <option value="adulto">Adulto</option>
            <option value="over65">Over 65</option>
        </select>

        <!-- pulsante per creare -->
        <button>Genera</button>
    </form>

    <!-- output dati biglietto -->
    <div class="biglietto">
        <h2>IL TUO BIGLIETTO</h2>
        <h4>Offerta</h4>
        <div id="offerta">            
        </div>
        <h4>Costo biglietto</h4>
        <div id="prezzo">            
        </div>
    </div>


    <script src="./js/script.js"></script>
</body>

</html>
